name: keep-warm fleet
# Ping toàn bộ fleet mỗi ~10 phút để chống Render free spin-down (cold-start 20 phút).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping all fleet health endpoints
        run: |
          urls=(
            https://minisso.onrender.com
            https://minigate-pasj.onrender.com
            https://minipim.onrender.com
            https://miniwms.onrender.com
            https://qinvoicelite.onrender.com
            https://minidms.onrender.com
            https://ministamp.onrender.com
            https://minitrace.onrender.com
            https://miniservice-hytf.onrender.com
            https://minishowroom.onrender.com
            https://miniinsurance.onrender.com
            https://minicontract.onrender.com
            https://minierp-5556.onrender.com
            https://minimobile.onrender.com
            https://minihr-kz1i.onrender.com
            https://minireconcile.onrender.com
            https://minipromo.onrender.com
            https://miniorigin.onrender.com
            https://minitvan.onrender.com
            https://minisign.onrender.com
            https://minigeo.onrender.com
            https://mininotify.onrender.com
          )
          for u in "${urls[@]}"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$u/healthz" || echo "ERR")
            echo "$u -> $code"
          done
