name: Keep fleet warm

# Render free ngủ sau ~15 phút không request → cold-start ~30-50s (app báo lỗi).
# Cron này ping /healthz mọi service mỗi 10 phút để giữ thức.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping all services
        run: |
          urls="https://miniaccounting-tk.onrender.com/healthz https://minicontract-512u.onrender.com/healthz https://minicskh-4pir.onrender.com/healthz https://minidms-tk.onrender.com/healthz https://minierp-t1kk.onrender.com/healthz https://minigate-pasj.onrender.com/healthz https://minipay-mje6.onrender.com/healthz https://minigeo-fz3y.onrender.com/healthz https://minihr-kz1i.onrender.com/healthz https://miniinsurance.onrender.com/healthz https://miniloyalty-pj9w.onrender.com/healthz https://minimobile.onrender.com/healthz https://mininotify-yw4g.onrender.com/healthz https://miniorigin-huug.onrender.com/healthz https://minipim.onrender.com/healthz https://minipromo-zoq3.onrender.com/healthz https://minireconcile.onrender.com/healthz https://miniservice-hytf.onrender.com/healthz https://minishowroom.onrender.com/healthz https://minisign-9tjk.onrender.com/healthz https://minisso.onrender.com/healthz https://ministamp.onrender.com/healthz https://minitrace.onrender.com/healthz https://minitvan-tk.onrender.com/healthz https://miniwms.onrender.com/healthz "
          for u in $urls; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 40 "$u" || echo ERR)
            echo "$u -> $code"
          done
